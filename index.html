      if (!arr.length) { for (var i = 0; i < 20; i++) out += '<i></i>'; return out; }
      for (var j = 0; j < arr.length; j++) {
        var v = num(arr[j] && arr[j][key]);
        out += '<i style="background:' + (v > 0 ? latColor(v) : 'rgba(255,255,255,.08)') + '"></i>';
      }
      return out;
    }
    function rowBar(label, valueText, percent, hot){
      return '<div class="nz-row"><span class="lb">' + label + '</span><div class="nz-track"><div class="nz-fill' + (hot ? ' hot' : '') + '" style="width:' + percent.toFixed(1) + '%"></div></div><span class="nz-val">' + valueText + '</span></div>';
    }
    function cardHTML(s){
      var on = isOn(s);
      var cpu = num(s.cpu);
      var ramU = num(s.ram_used) * MB, ramT = num(s.ram_total) * MB;
      var dkU = num(s.disk_used) * MB, dkT = num(s.disk_total) * MB;
      var monR = num(s.net_rx_monthly), monT = num(s.net_tx_monthly);
      var used = monR + monT, lim = num(s.traffic_limit) * MB;
      var la = loadAvg(s);
      var exp = expireInfo(s);
      var ipb = (String(s.ip_v4) === '1' ? '<span class="ipb">IP4</span>' : '') + (String(s.ip_v6) === '1' ? '<span class="ipb">IP6</span>' : '');
      var price = num(s.price);
      var priceTxt = price > 0 ? esc(s.currency || '') + price + '/' + (CYCLE[s.billing_cycle] || esc(s.billing_cycle || '')) : '';
      var h = '<div class="nz-card' + (on ? '' : ' offline') + '">';
      h += '<div class="nz-card-head"><span class="nz-flag">' + flag(s.region) + '</span><span class="nz-name">' + esc(s.name) + '</span><span class="nz-os">' + osIcon(s.os) + '</span><span class="nz-badge ' + (on ? 'on' : 'off') + '">' + (on ? '\u5728\u7EBF' : '\u79BB\u7EBF') + '</span></div>';
      h += '<div class="nz-sub">' + ipb + (priceTxt ? '<span>' + priceTxt + '</span>' : '') + (exp ? '<span class="' + (exp.days <= 30 ? 'exp' : '') + '">\u5230\u671F ' + esc(exp.date.slice(5)) + ' (' + (exp.days > 0 ? exp.days + '\u5929' : '\u5DF2\u8FC7\u671F') + ')</span>' : '') + '</div>';
      h += rowBar('CPU', cpu.toFixed(1) + '%', cpu, cpu >= 80);
      h += rowBar('\u5185\u5B58', fmtBytes(ramU) + ' / ' + fmtBytes(ramT), pct(ramU, ramT), ramT > 0 && ramU / ramT >= 0.8);
      h += rowBar('\u786C\u76D8', fmtBytes(dkU) + ' / ' + fmtBytes(dkT), pct(dkU, dkT), dkT > 0 && dkU / dkT >= 0.8);
      if (lim > 0) h += rowBar('\u7528\u91CF', fmtBytes(used) + ' / ' + fmtBytes(lim), pct(used, lim), used / lim >= 0.8);
      else if (used > 0) h += rowBar('\u7528\u91CF', fmtBytes(used), 0, false);
      h += '<div class="nz-kv"><span class="lb">\u8D1F\u8F7D</span><span class="vl">' + (la.length ? la.map(function(v){ return '<b style="color:' + ldColor(v) + ';font-weight:600">' + v.toFixed(2) + '</b>'; }).join(' ') : '-') + '</span></div>';
      h += '<div class="nz-kv"><span class="lb">\u7F51\u7EDC</span><span class="vl"><span class="nz-up">\u2191 ' + fmtSpeed(num(s.net_out_speed)) + '</span><span class="nz-down">\u2193 ' + fmtSpeed(num(s.net_in_speed)) + '</span></span></div>';
      h += '<div class="nz-kv"><span class="lb">\u6708\u6D41\u91CF</span><span class="vl"><span class="nz-down">\u2193 ' + fmtBytes(monR) + '</span><span class="nz-up">\u2191 ' + fmtBytes(monT) + '</span></span></div>';
      var car = [['\u7535\u4FE1', 'ct'], ['\u8054\u901A', 'cu'], ['\u79FB\u52A8', 'cm']];
      for (var i = 0; i < car.length; i++) {
        var k = car[i][1], lv = num(s['ping_' + k]), ls = num(s['loss_' + k]);
        h += '<div class="nz-ping"><span class="lb">' + car[i][0] + '</span><span class="nz-lat" style="color:' + latColor(lv) + '">' + (lv > 0 ? lv + 'ms' : '-') + '</span><div class="nz-segs">' + segsHTML(s.ping, k) + '</div><span class="nz-loss">' + ls.toFixed(0) + '%</span></div>';
      }
      h += '</div>';
      return h;
    }
    function latencyHTML(s){
      var on = isOn(s);
      var h = '<div class="nz-dsrv">';
      h += '<div class="nz-dhead"><span class="nz-flag">' + flag(s.region) + '</span><b style="color:#fff;font-size:14px">' + esc(s.name) + '</b><span class="nz-os">' + osIcon(s.os) + '</span><span style="flex:1"></span><span class="nz-badge ' + (on ? 'on' : 'off') + '">' + (on ? '\u5728\u7EBF' : '\u79BB\u7EBF') + '</span></div>';
      var car = [['\u7535\u4FE1', 'ct', 'loss_ct'], ['\u8054\u901A', 'cu', 'loss_cu'], ['\u79FB\u52A8', 'cm', 'loss_cm']];
      for (var i = 0; i < car.length; i++) {
        var k = car[i][1], lv = num(s['ping_' + k]), ls = num(s[car[i][2]]);
        h += '<div class="nz-drow"><span class="lb">' + car[i][0] + '</span><div class="nz-dsegs">' + segsHTML(s.ping, k) + '</div><span class="val" style="color:' + latColor(lv) + '">' + (lv > 0 ? lv + 'ms' : '-') + '</span><span class="ls">' + ls.toFixed(0) + '%</span></div>';
      }
      h += '</div>';
      return h;
    }
    function ringCardHTML(s){
      var on = isOn(s);
      var cpu = num(s.cpu);
      var memP = num(s.ram_total) > 0 ? num(s.ram_used) / num(s.ram_total) * 100 : 0;
      var dkP = num(s.disk_total) > 0 ? num(s.disk_used) / num(s.disk_total) * 100 : 0;
      function rgColor(v){ return v >= 85 ? '#f44336' : v >= 60 ? '#ff9800' : '#4caf50'; }
      function ring(p, cap){
        var C = 2 * Math.PI * 26.5;
        var off = C * (1 - Math.max(0, Math.min(100, p)) / 100);
        return '<div class="nz-ring"><svg viewBox="0 0 62 62"><circle class="bg" cx="31" cy="31" r="26.5"></circle><circle class="fg" cx="31" cy="31" r="26.5" stroke="' + rgColor(p) + '" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"></circle></svg><span class="pct" style="color:' + rgColor(p) + '">' + p.toFixed(0) + '%</span><span class="cap">' + cap + '</span></div>';
      }
      var h = '<div class="nz-ring-card' + (on ? '' : ' offline') + '">';
      h += '<div class="rc-head"><span class="rc-name">' + flag(s.region) + ' ' + esc(s.name) + '</span><span class="rc-os">' + (on ? osIcon(s.os) + ' ' + esc(String(s.os || '').slice(0, 26)) : '\u79BB\u7EBF') + '</span></div>';
      h += '<div class="nz-rings">' + ring(cpu, 'CPU') + ring(memP, '\u5185\u5B58') + ring(dkP, '\u786C\u76D8') + '</div>';
      h += '</div>';
      return h;
    }
    var CENT = { CN:[35,105], HK:[22.3,114.2], MO:[22.2,113.5], TW:[23.7,121], JP:[36,138], KR:[36.5,127.8], KP:[40,127], SG:[1.35,103.8], MY:[4,102], TH:[15,101], VN:[16,107], PH:[12,122], ID:[-2,118], IN:[22,79], US:[39,-98], CA:[56,-106], MX:[23,-102], BR:[-10,-55], AR:[-34,-64], GB:[54,-2], UK:[54,-2], DE:[51,10], FR:[46,2], NL:[52.2,5.3], RU:[61,90], AU:[-25,133], NZ:[-41,174], TR:[39,35], AE:[24,54], SA:[24,45], PL:[52,19], ES:[40,-4], IT:[42,12], UA:[49,32] };
    function mapHTML(servers){
      var W = 1100, H = 550;
      var byReg = {};
      servers.forEach(function(s){ var r = String(s.region || '').toUpperCase() || '??'; if (!byReg[r]) byReg[r] = { n: 0, on: 0 }; byReg[r].n++; if (isOn(s)) byReg[r].on++; });
      var h = '<div class="nz-map"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid slice">';
      for (var gx = 14; gx < W; gx += 22) for (var gy = 14; gy < H; gy += 22) h += '<circle class="nz-dot" cx="' + gx + '" cy="' + gy + '" r="1.6"></circle>';
      Object.keys(byReg).forEach(function(r){
        var c = CENT[r];
        if (!c) return;
        var x = (c[1] + 180) / 360 * W, y = (90 - c[0]) / 180 * H;
        var allOn = byReg[r].on === byReg[r].n;
        var col = allOn ? '#4cc2ff' : '#f44336';
        h += '<g class="nz-marker">';
        h += '<circle class="halo" cx="' + x + '" cy="' + y + '" r="10" style="fill:' + col + '"></circle>';
        h += '<circle class="ring" cx="' + x + '" cy="' + y + '" r="7" style="stroke:' + col + '"></circle>';
        h += '<circle class="core" cx="' + x + '" cy="' + y + '" r="3.2" style="fill:' + col + '"></circle>';
        h += '<text class="lbl" x="' + (x + 12) + '" y="' + (y + 4) + '">' + esc(r) + ' \u00D7' + byReg[r].n + '</text>';
        h += '</g>';
      });
      h += '</svg></div>';
      h += '<div class="nz-grid">' + servers.map(ringCardHTML).join('') + '</div>';
      return h;
    }
    function render(){
      var cfg = S.cfg || {};
      var all = S.servers;
      var onCnt = all.filter(isOn).length, offCnt = all.length - onCnt;
      var tR = 0, tX = 0, sR = 0, sX = 0, value = {};
      all.forEach(function(s){ tR += num(s.net_rx_monthly); tX += num(s.net_tx_monthly); sR += num(s.net_in_speed); sX += num(s.net_out_speed); var c = s.currency || ''; value[c] = (value[c] || 0) + num(s.price); });
      var vis = all.filter(function(s){
        if (S.region !== 'ALL' && String(s.region || '').toUpperCase() !== S.region) return false;
        if (S.status === 'ON' && !isOn(s)) return false;
        if (S.status === 'OFF' && isOn(s)) return false;
        return true;
      });
      var regions = {}; all.forEach(function(s){ var r = String(s.region || '').toUpperCase() || '??'; regions[r] = (regions[r] || 0) + 1; });
      var valueTxt = Object.keys(value).map(function(c){ return (c || '') + Math.round(value[c]); }).join(' \u00B7 ');
      var h = '';
      h += '<nav class="nz-nav"><div class="nz-nav-in"><span class="nz-logo"><span class="dot"></span>' + esc(cfg.site_title || 'Cloudflare Server Monitor') + '</span><div class="nz-nav-stats"><span>\u5171 ' + all.length + ' \u53F0</span><span class="sep">|</span><span>\u5728\u7EBF <b class="nz-on">' + onCnt + '</b></span><span>\u79BB\u7EBF <b class="nz-offc">' + offCnt + '</b></span><span class="sep">|</span><span>\u6D41\u91CF <span class="nz-up">\u2191' + fmtBytes(tX) + '</span> <span class="nz-down">\u2193' + fmtBytes(tR) + '</span></span><a class="nz-login" href="./admin">\u{1F464} \u767B\u5F55</a></div></div></nav>';
      h += '<div class="nz-main"><div class="nz-panel">';
      h += '<div class="nz-tabs"><button class="nz-tab' + (S.view === 'card' ? ' active' : '') + '" data-view="card">\u{1F4CA} \u5361\u7247</button><button class="nz-tab' + (S.view === 'latency' ? ' active' : '') + '" data-view="latency">\u{1F4C9} \u5EF6\u8FDF</button><button class="nz-tab' + (S.view === 'map' ? ' active' : '') + '" data-view="map">\u{1F5FA} \u5730\u56FE</button></div>';
      h += '<div class="nz-chips"><button class="nz-chip' + (S.region === 'ALL' ? ' active' : '') + '" data-region="ALL">\u5168\u90E8<span class="n">' + all.length + '</span></button>';
      Object.keys(regions).sort().forEach(function(r){ h += '<button class="nz-chip' + (S.region === r ? ' active' : '') + '" data-region="' + esc(r) + '">' + esc(r) + '<span class="n">' + regions[r] + '</span></button>'; });
      h += '<span class="grow"></span><button class="nz-chip' + (S.status === 'ALL' ? ' active' : '') + '" data-status="ALL">\u5168\u90E8</button><button class="nz-chip' + (S.status === 'ON' ? ' active' : '') + '" data-status="ON">\u5728\u7EBF</button><button class="nz-chip' + (S.status === 'OFF' ? ' active' : '') + '" data-status="OFF">\u79BB\u7EBF</button></div>';
      h += '<div class="nz-stats">';
      h += '<div class="nz-stat"><div class="lb">\u670D\u52A1</div><div class="vl"><span class="nz-on" style="font-weight:700">' + vis.filter(isOn).length + '</span> / ' + vis.length + '</div></div>';
      h += '<div class="nz-stat"><div class="lb">\u603B\u6D41\u91CF</div><div class="vl"><span class="nz-up">\u2191 ' + fmtBytes(tX) + '</span> <span class="nz-down">\u2193 ' + fmtBytes(tR) + '</span></div></div>';
      h += '<div class="nz-stat"><div class="lb">\u5B9E\u65F6\u901F\u5EA6</div><div class="vl"><span class="nz-up">\u2191 ' + fmtSpeed(sX) + '</span> <span class="nz-down">\u2193 ' + fmtSpeed(sR) + '</span></div></div>';
      h += '<div class="nz-stat"><div class="lb">\u5269\u4F59\u4EF7\u503C</div><div class="vl" style="color:#4cc2ff">' + (valueTxt || '-') + '</div></div>';
      h += '</div>';
      if (S.err) h += '<div class="nz-err">' + esc(S.err) + '</div>';
      if (!vis.length) {
        h += '<div class="nz-nodata">\u6CA1\u6709\u7B26\u5408\u6761\u4EF6\u7684\u670D\u52A1\u5668</div>';
      } else if (S.view === 'card') {
        var groups = {}, gOrder = [];
        vis.forEach(function(s){ var g = s.server_group || 'Default'; if (!groups[g]) { groups[g] = []; gOrder.push(g); } groups[g].push(s); });
        gOrder.forEach(function(g){
          h += '<div class="nz-group">' + esc(g) + ' <span class="n">[' + groups[g].length + ']</span></div>';
          h += '<div class="nz-grid">' + groups[g].map(cardHTML).join('') + '</div>';
        });
      } else if (S.view === 'latency') {
        h += '<div style="padding-top:4px">' + vis.map(latencyHTML).join('') + '</div>';
      } else {
        h += mapHTML(vis);
      }
      h += '</div><div class="nz-foot">Powered by Cloudflare Server Monitor \u00B7 Nazhua \u98CE\u683C</div></div>';
      h += '<button class="nz-fab" id="nz-fab" title="\u98CE\u683C\u5207\u6362">\u2699</button><div class="nz-menu" id="nz-menu"></div>';
      root.innerHTML = h;
    }
    function wire(){
      root.addEventListener('click', function(e){
        var t = e.target;
        var tab = t.closest ? t.closest('.nz-tab') : null;
        if (tab) { S.view = tab.getAttribute('data-view'); render(); return; }
        var chip = t.closest ? t.closest('.nz-chip') : null;
        if (chip) {
          if (chip.hasAttribute('data-region')) S.region = chip.getAttribute('data-region');
          else if (chip.hasAttribute('data-status')) S.status = chip.getAttribute('data-status');
          render(); return;
        }
        if (t.id === 'nz-fab') { var m = document.getElementById('nz-menu'); if (m) m.classList.toggle('open'); return; }
        var mb = t.closest ? t.closest('.nz-menu button') : null;
        if (mb) {
          try { localStorage.removeItem('win2000_style'); localStorage.setItem('win2000_style_site', mb.getAttribute('data-style')); } catch (err) {}
          location.reload();
        }
      });
      var menu = document.getElementById('nz-menu');
      if (menu) {
        var styles = [['nezha', 'Nazhua \u54EA\u5410\u63A2\u9488'], ['win2000', 'Windows 2000'], ['win11', 'Windows 11'], ['xp', 'Windows XP'], ['win31', 'Windows 3.1'], ['osx', 'macOS']];
        menu.innerHTML = styles.map(function(x){ return '<button data-style="' + x[0] + '"' + (x[0] === 'nezha' ? ' class="cur"' : '') + '>' + x[1] + '</button>'; }).join('');
      }
    }
    async function load(){
      try {
        var rc = await fetch('/api/config', { cache: 'no-store' });
        S.cfg = await rc.json();
      } catch (e) { S.cfg = {}; }
      try {
        var rs = await fetch('/api/servers', { cache: 'no-store' });
        var d = await rs.json();
        S.servers = (d.servers || []).filter(function(s){ return String(s.is_hidden) !== '1'; });
        S.err = '';
      } catch (e) { S.err = '\u6570\u636E\u52A0\u8F7D\u5931\u8D25\uFF1A' + e.message; }
      render();
    }
    wire();
    load();
    setInterval(load, 15000);
  })();
  </script>
